<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9ecee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="循原文之据，理交付之序 · 保存在本机的 AI 项目交付工作台" />
    <title>循序 · Cadence — 本地 AI 交付工作台</title>
    <script>
      try {
        var t = localStorage.getItem('pa:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
