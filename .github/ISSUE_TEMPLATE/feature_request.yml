name: 场景需求与建议 / Feature Request
description: 提出项目经理实战场景痛点、新格式支持或体验优化建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你的真实工作场景与痛点 / Problem & PM Workflow Scenario
      description: 建议从具体工作流讲起（例如：周会纪要整理、跨部门催办、乙方客户验收、向老板汇报等）。
      placeholder: "我每天/每周需要处理……目前最耗时的地方是……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望「循序」怎么帮你解决？/ Proposed Solution
      placeholder: "希望支持……"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你目前用什么替代方式？（可选）/ Current Workaround
      placeholder: "目前靠 Excel 手动汇总 / 复制进网页 AI……"
