name: Signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    # Configure a protected environment with publisher credentials before running.
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PROJECT_ASSISTANT_UPDATE_URL: ${{ vars.PROJECT_ASSISTANT_UPDATE_URL }}
      PROJECT_ASSISTANT_UPDATE_PUBKEY: ${{ vars.PROJECT_ASSISTANT_UPDATE_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: rustup show active-toolchain
      - run: npm ci
      - name: Import Windows publisher certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:CERTIFICATE -or !$env:CERTIFICATE_PASSWORD) { throw 'Publisher certificate is missing.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'publisher.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE))
          try {
            $certificatePassword = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $certificatePassword
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Remove-Item -LiteralPath $certificatePath -Force }
      - name: Import Apple publisher certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/publisher.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/publisher.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/publisher.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/publisher.keychain-db"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/publisher.keychain-db"
          security import "$RUNNER_TEMP/publisher.p12" -k "$RUNNER_TEMP/publisher.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/publisher.keychain-db"
          rm "$RUNNER_TEMP/publisher.p12"
      - run: node scripts/release-preflight.mjs
      - run: npm run desktop:build -- --ci --config src-tauri/tauri.release.local.json
      - name: Verify Windows installer signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path target/release/bundle/nsis -Filter *.exe)
          if ($installers.Count -eq 0) { throw 'No installer was built.' }
          foreach ($installer in $installers) {
            if ((Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status -ne 'Valid') { throw 'Installer signature is not valid.' }
          }
      - name: Verify notarized Apple application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for app in target/release/bundle/macos/*.app; do
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.sig
          if-no-files-found: error
          retention-days: 14
      - name: Remove Windows signing identity
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
      - name: Remove Apple build keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/publisher.keychain-db" || true
