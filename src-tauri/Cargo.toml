[package]
name = "project-assistant-desktop"
version = "0.3.0"
edition = "2021"
description = "Local-first project memory workspace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
project-assistant-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
